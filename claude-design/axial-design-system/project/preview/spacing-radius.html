<!doctype html><html><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:14px">Radius · soft level 1 · never pill-shaped (status dots excepted)</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">
    <div class="col" style="align-items:center;gap:8px"><div style="width:72px;height:72px;background:#1a2026;border:1px solid #45464d;border-radius:2px"></div><div class="label" style="font-size:12px;color:#dde3eb">2 · sm</div><div class="hex">chips</div></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:72px;height:72px;background:#1a2026;border:1px solid #45464d;border-radius:4px"></div><div class="label" style="font-size:12px;color:#dde3eb">4 · DEFAULT</div><div class="hex">buttons · inputs</div></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:72px;height:72px;background:#1a2026;border:1px solid #45464d;border-radius:8px"></div><div class="label" style="font-size:12px;color:#dde3eb">8 · lg</div><div class="hex">cards</div></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:72px;height:72px;background:#1a2026;border:1px solid #45464d;border-radius:12px"></div><div class="label" style="font-size:12px;color:#dde3eb">12 · xl</div><div class="hex">primary containers · modals</div></div>
    <div class="col" style="align-items:center;gap:8px"><div style="width:72px;height:72px;background:#2DD4BF;border-radius:9999px"></div><div class="label" style="font-size:12px;color:#dde3eb">9999 · full</div><div class="hex">status dots only</div></div>
  </div>
</div>
</body></html>
