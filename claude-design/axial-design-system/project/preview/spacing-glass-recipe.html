<!doctype html><html><head><meta charset="utf-8"><title>Glass recipe</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="background:#0e141a;padding:0;overflow:hidden">
  <!-- ambient gradient under the glass to show blur -->
  <div style="position:relative;height:240px;background:
      radial-gradient(40% 60% at 20% 30%, rgba(190,198,224,0.18), transparent 60%),
      radial-gradient(40% 60% at 90% 80%, rgba(45,212,191,0.18), transparent 60%),
      linear-gradient(180deg,#0e141a,#080f14)">
    <div style="position:absolute;left:24px;top:20px;font:600 11px/1.2 Geist;letter-spacing:0.12em;color:#c6c6cd;text-transform:uppercase">Glass recipe</div>
    <div style="position:absolute;inset:60px 24px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div style="background:rgba(20,26,36,0.40);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(226,232,240,0.10);border-radius:12px;padding:14px">
        <div style="font:600 11px/1.2 Geist;color:#c6c6cd;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px">Light blur · 12px</div>
        <div style="color:#dde3eb;font:500 14px/1.4 Geist">Standard glass card</div>
        <div class="mono muted" style="margin-top:8px">bg-surface-container/40 · backdrop-blur-xl · border-top white/10</div>
      </div>
      <div style="background:rgba(20,26,36,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(226,232,240,0.10);border-radius:12px;padding:14px">
        <div style="font:600 11px/1.2 Geist;color:#c6c6cd;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px">Heavy blur · 20px</div>
        <div style="color:#dde3eb;font:500 14px/1.4 Geist">Sticky headers · sidebar</div>
        <div class="mono muted" style="margin-top:8px">bg-surface/60 · backdrop-blur-2xl</div>
      </div>
    </div>
  </div>
</div>
</body></html>
