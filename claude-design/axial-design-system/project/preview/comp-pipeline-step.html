<!doctype html><html><head><meta charset="utf-8"><title>Pipeline step</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:18px">Pipeline · timeline of background state · pending = teal glow</div>
  <div style="position:relative;display:flex;flex-direction:column;gap:18px">
    <div style="position:absolute;left:23px;top:24px;bottom:24px;width:1px;background:rgba(144,144,151,0.2)"></div>
    <!-- step 1 done -->
    <div style="display:flex;gap:18px;position:relative;z-index:1">
      <div style="width:48px;height:48px;border-radius:9999px;background:#2f353c;border:1px solid rgba(144,144,151,0.3);display:flex;align-items:center;justify-content:center;color:#c6c6cd;font:600 16px/1 Geist">✓</div>
      <div style="padding-top:4px">
        <div style="font:500 14px/1.4 Geist;color:#dde3eb">Invoice Verification</div>
        <div style="font:400 13px/1.5 Geist;color:#c6c6cd;margin-top:3px">OCR and metadata extraction complete.</div>
      </div>
    </div>
    <!-- step 2 active -->
    <div style="display:flex;gap:18px;position:relative;z-index:1">
      <div style="width:48px;height:48px;border-radius:9999px;background:rgba(45,212,191,0.18);border:1px solid rgba(45,212,191,0.5);box-shadow:0 0 15px rgba(45,212,191,0.3);display:flex;align-items:center;justify-content:center;color:#2DD4BF;font:600 16px/1 Geist">●</div>
      <div style="padding-top:4px;flex:1">
        <div style="font:500 14px/1.4 Geist;color:#2DD4BF">Minting in Progress</div>
        <div style="font:400 13px/1.5 Geist;color:#c6c6cd;margin-top:3px">Deploying Soroban asset representation.</div>
        <div style="margin-top:10px;height:3px;background:#2f353c;border-radius:9999px;overflow:hidden;max-width:280px"><div style="height:100%;width:66%;background:#2DD4BF"></div></div>
      </div>
    </div>
    <!-- step 3 dim -->
    <div style="display:flex;gap:18px;position:relative;z-index:1;opacity:0.5">
      <div style="width:48px;height:48px;border-radius:9999px;background:rgba(47,53,60,0.5);border:1px solid rgba(144,144,151,0.15);display:flex;align-items:center;justify-content:center;color:#909097">○</div>
      <div style="padding-top:4px">
        <div style="font:500 14px/1.4 Geist;color:#dde3eb">Liquidity Matching</div>
        <div style="font:400 13px/1.5 Geist;color:#c6c6cd;margin-top:3px">Awaiting token finality.</div>
      </div>
    </div>
  </div>
</div>
</body></html>
