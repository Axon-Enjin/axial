<!doctype html><html><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:24px">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:18px">Brandmark · architect's compass · soft silver on obsidian</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:60px;height:60px;border-radius:10px;background:#1a2026;border:1px solid rgba(69,70,77,0.6);display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(190,198,224,0.10)">
        <img src="../assets/logos/axial-mark.svg" alt="" width="36" height="36">
      </div>
      <div>
        <div style="font:700 22px/1.1 Geist;color:#bec6e0;letter-spacing:-0.01em">Axial MVP</div>
        <div style="font:600 10px/1.2 Geist;letter-spacing:0.18em;color:#c6c6cd;text-transform:uppercase;margin-top:3px">Architect Mode</div>
      </div>
    </div>
    <div style="font:400 13px/1.6 Geist;color:#c6c6cd">
      The mark is the "architecture" Material Symbol — compass + drafting strokes — rendered in <em style="color:#bec6e0;font-style:normal">primary</em> on a <em style="color:#bec6e0;font-style:normal">surface-container</em> chip with a subtle primary glow.
    </div>
  </div>
</div>
</body></html>
