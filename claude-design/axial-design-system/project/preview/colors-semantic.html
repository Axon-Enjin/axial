<!doctype html><html><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:16px">Semantic state · warning · error</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
    <div class="swatch"><div class="chip" style="background:#FBBF24"></div><div class="label">warning</div><div class="hex">#FBBF24</div></div>
    <div class="swatch"><div class="chip" style="background:#ffb4ab"></div><div class="label">error</div><div class="hex">#ffb4ab</div></div>
    <div class="swatch"><div class="chip" style="background:#93000a"></div><div class="label">error-container</div><div class="hex">#93000a</div></div>
    <div class="swatch"><div class="chip" style="background:#dec29a"></div><div class="label">tertiary</div><div class="hex">#dec29a</div></div>
  </div>
  <div class="muted" style="margin-top:14px;font-size:12px;line-height:1.5">Used sparingly. Warning = T+3 window approaching. Error always pairs with a human next step — never alarmist.</div>
</div>
</body></html>
