<!doctype html><html><head><meta charset="utf-8"><title>Stat tile</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:18px">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:14px">Stat tile · glass · KPI</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
    <div style="background:rgba(20,26,36,0.50);border-top:1px solid rgba(226,232,240,0.10);border-radius:8px;padding:16px;backdrop-filter:blur(12px)">
      <div style="font:600 11px/1.2 Geist;color:#c6c6cd;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px">Total Liquidity Pool</div>
      <div style="font:600 28px/1.1 Geist;color:#bec6e0;letter-spacing:-0.01em;font-variant-numeric:tabular-nums">2.4M <span style="font:500 16px/1 Geist;color:#c6c6cd">USDC</span></div>
    </div>
    <div style="background:rgba(20,26,36,0.50);border-top:1px solid rgba(226,232,240,0.10);border-radius:8px;padding:16px;backdrop-filter:blur(12px)">
      <div style="font:600 11px/1.2 Geist;color:#c6c6cd;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px">24h Swap Volume</div>
      <div style="font:600 28px/1.1 Geist;color:#dde3eb;letter-spacing:-0.01em;font-variant-numeric:tabular-nums">850K <span style="font:500 16px/1 Geist;color:#c6c6cd">USDC</span></div>
    </div>
    <div style="background:rgba(20,26,36,0.50);border-top:1px solid rgba(226,232,240,0.10);border-radius:8px;padding:16px;backdrop-filter:blur(12px)">
      <div style="font:600 11px/1.2 Geist;color:#c6c6cd;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px">Active Smart Contracts</div>
      <div style="font:600 28px/1.1 Geist;color:#dde3eb;letter-spacing:-0.01em;font-variant-numeric:tabular-nums">142</div>
    </div>
  </div>
</div>
</body></html>
