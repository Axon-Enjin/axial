<!doctype html><html><head><meta charset="utf-8"><title>Primary</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:16px">Primary · soft silver · CTA + active rails</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
    <div class="swatch"><div class="chip" style="background:#0f172a"></div><div class="label">primary-container</div><div class="hex">#0f172a</div></div>
    <div class="swatch"><div class="chip" style="background:#bec6e0"></div><div class="label">primary</div><div class="hex">#bec6e0</div></div>
    <div class="swatch"><div class="chip" style="background:#dae2fd"></div><div class="label">primary-fixed</div><div class="hex">#dae2fd</div></div>
    <div class="swatch"><div class="chip" style="background:#565e74"></div><div class="label">inverse-primary</div><div class="hex">#565e74</div></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:18px;align-items:center">
    <button style="background:#bec6e0;color:#283044;border:0;border-radius:8px;padding:10px 18px;font:600 13px/1 Geist,sans-serif;letter-spacing:0.02em;box-shadow:0 0 20px rgba(190,198,224,0.15);cursor:pointer">Unlock Capital</button>
    <span class="mono muted">→ on-primary #283044</span>
  </div>
</div>
</body></html>
