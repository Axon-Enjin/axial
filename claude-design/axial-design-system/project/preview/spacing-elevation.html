<!doctype html><html><head><meta charset="utf-8"><title>Elevation + glow</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:18px">Elevation · glass + glow, not heavy shadows</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px">
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:#1a2026;border:1px solid rgba(69,70,77,0.4);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.35)"></div>
      <div class="label" style="font-size:12px;color:#dde3eb">shadow-sm</div>
      <div class="hex" style="text-align:center">inline cards</div>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:#1a2026;border-top:1px solid rgba(226,232,240,0.10);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.45);backdrop-filter:blur(20px)"></div>
      <div class="label" style="font-size:12px;color:#dde3eb">shadow-md</div>
      <div class="hex" style="text-align:center">floating panels · modals</div>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:#1a2026;border:1px solid rgba(190,198,224,0.25);border-radius:8px;box-shadow:0 0 20px rgba(190,198,224,0.20)"></div>
      <div class="label" style="font-size:12px;color:#dde3eb">primary glow</div>
      <div class="hex" style="text-align:center">sidebar logo · primary CTA</div>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:96px;height:64px;background:rgba(45,212,191,0.18);border:1px solid rgba(45,212,191,0.5);border-radius:8px;box-shadow:0 0 15px rgba(45,212,191,0.3)"></div>
      <div class="label" style="font-size:12px;color:#dde3eb">teal glow</div>
      <div class="hex" style="text-align:center">active · pending · success</div>
    </div>
  </div>
</div>
</body></html>
