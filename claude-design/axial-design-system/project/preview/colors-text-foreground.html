<!doctype html><html><head><meta charset="utf-8"><title>Text colors</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:16px">Foreground · text + outline</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
    <div class="swatch"><div class="chip" style="background:#dde3eb"></div><div class="label">on-surface</div><div class="hex">#dde3eb</div></div>
    <div class="swatch"><div class="chip" style="background:#c6c6cd"></div><div class="label">on-surface-variant</div><div class="hex">#c6c6cd</div></div>
    <div class="swatch"><div class="chip" style="background:#909097"></div><div class="label">outline</div><div class="hex">#909097</div></div>
    <div class="swatch"><div class="chip" style="background:#45464d"></div><div class="label">outline-variant</div><div class="hex">#45464d</div></div>
  </div>
  <div style="margin-top:18px">
    <p style="margin:0;color:#dde3eb;font:400 16px/1.5 Geist">Primary copy lives on <em>on-surface</em>.</p>
    <p style="margin:4px 0 0;color:#c6c6cd;font:400 14px/1.4 Geist">Secondary descriptors and labels use <em>on-surface-variant</em>.</p>
    <p style="margin:4px 0 0;color:#909097;font:600 11px/1.2 Geist;letter-spacing:0.06em;text-transform:uppercase">Tertiary metadata uses outline.</p>
  </div>
</div>
</body></html>
