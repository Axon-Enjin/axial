<!doctype html><html><head><meta charset="utf-8"><title>Bioluminescent teal</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:16px">Bioluminescent teal · live · pending blockchain · success</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end">
    <div class="swatch"><div class="chip" style="background:#2DD4BF;box-shadow:0 0 15px rgba(45,212,191,0.3)"></div><div class="label">active</div><div class="hex">#2DD4BF</div></div>
    <div class="swatch"><div class="chip" style="background:#34D399"></div><div class="label">success</div><div class="hex">#34D399</div></div>
    <div class="swatch"><div class="chip" style="background:rgba(45,212,191,0.18);border:1px solid rgba(45,212,191,0.4)"></div><div class="label">active soft fill</div><div class="hex">rgba(45,212,191,.18)</div></div>
  </div>
  <div style="margin-top:18px;display:flex;align-items:center;gap:14px">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:9999px;background:rgba(20,26,36,0.6);border:1px solid rgba(69,70,77,0.4);font:600 11px/1.2 Geist,sans-serif;color:#dde3eb;letter-spacing:0.05em">
      <span style="width:7px;height:7px;border-radius:9999px;background:#2DD4BF;box-shadow:0 0 10px rgba(45,212,191,.6)"></span>
      NETWORK ACTIVE
    </span>
    <span class="mono muted">Use ONLY for live/active/success.</span>
  </div>
</div>
</body></html>
