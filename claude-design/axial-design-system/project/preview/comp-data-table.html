<!doctype html><html><head><meta charset="utf-8"><title>Data table</title><link rel="stylesheet" href="_card.css">
<style>
  table { width:100%; border-collapse:collapse; }
  th { font:600 10px/1.2 Geist; letter-spacing:0.08em; text-transform:uppercase; color:#c6c6cd; text-align:left; padding:10px 12px; border-bottom:1px solid rgba(69,70,77,0.4); }
  td { font:400 13px/1.4 Geist; color:#dde3eb; padding:14px 12px; border-bottom:1px solid rgba(69,70,77,0.2); }
  td.num { font-family:'Geist Mono',monospace; font-variant-numeric:tabular-nums; text-align:right; }
  .pill { display:inline-flex; gap:6px; align-items:center; padding:4px 10px; border-radius:9999px; font:600 11px/1.2 Geist; letter-spacing:0.05em; border:1px solid; }
</style></head><body>
<div class="card" style="padding:0;overflow:hidden">
  <div style="padding:18px 16px 12px"><div class="eyebrow">Data table · no alt rows · 10% silver dividers</div></div>
  <table>
    <thead><tr>
      <th>Invoice ID</th><th>Counterparty</th><th>Terms</th><th style="text-align:right">Face value</th><th style="text-align:center">Status</th>
    </tr></thead>
    <tbody>
      <tr><td style="font-family:'Geist Mono',monospace">INV-2023-8901</td><td style="color:#c6c6cd">Acme Logistics Corp</td><td><span class="pill" style="background:#2f353c;border-color:transparent;color:#dde3eb;border-radius:2px">Net 60</span></td><td class="num">$125,000.00</td><td style="text-align:center"><span class="pill" style="background:rgba(62,73,93,0.4);border-color:rgba(188,199,222,0.2);color:#bcc7de"><span style="width:6px;height:6px;border-radius:9999px;background:#bcc7de"></span>Minted</span></td></tr>
      <tr><td style="font-family:'Geist Mono',monospace">INV-2023-8904</td><td style="color:#c6c6cd">Nexus Tech Solutions</td><td><span class="pill" style="background:#2f353c;border-color:transparent;color:#dde3eb;border-radius:2px">Net 90</span></td><td class="num">$450,000.00</td><td style="text-align:center"><span class="pill" style="background:rgba(47,53,60,0.4);border-color:rgba(144,144,151,0.2);color:#c6c6cd"><span style="width:6px;height:6px;border-radius:9999px;background:#909097"></span>Scanning</span></td></tr>
      <tr><td style="font-family:'Geist Mono',monospace">INV-2023-8872</td><td style="color:#c6c6cd">Global Freight Systems</td><td><span class="pill" style="background:#2f353c;border-color:transparent;color:#dde3eb;border-radius:2px">Net 30</span></td><td class="num">$75,500.00</td><td style="text-align:center"><span class="pill" style="background:rgba(45,212,191,0.10);border-color:rgba(45,212,191,0.3);color:#2DD4BF">✓ Settled</span></td></tr>
    </tbody>
  </table>
</div>
</body></html>
