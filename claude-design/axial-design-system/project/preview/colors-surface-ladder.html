<!doctype html><html><head><meta charset="utf-8"><title>Surface ladder</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="ambient"></div>
  <div class="eyebrow" style="margin-bottom:16px">Surface elevation · dark-mode first</div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
    <div class="swatch"><div class="chip" style="background:#080f14"></div><div class="label">lowest</div><div class="hex">#080f14</div></div>
    <div class="swatch"><div class="chip" style="background:#0e141a"></div><div class="label">background</div><div class="hex">#0e141a</div></div>
    <div class="swatch"><div class="chip" style="background:#161c22"></div><div class="label">low</div><div class="hex">#161c22</div></div>
    <div class="swatch"><div class="chip" style="background:#1a2026"></div><div class="label">container</div><div class="hex">#1a2026</div></div>
    <div class="swatch"><div class="chip" style="background:#242b31"></div><div class="label">high</div><div class="hex">#242b31</div></div>
    <div class="swatch"><div class="chip" style="background:#2f353c"></div><div class="label">highest</div><div class="hex">#2f353c</div></div>
  </div>
  <div class="muted" style="margin-top:14px;font-size:12px;line-height:1.5">Obsidian canvas · deep-slate panels · subtle 1px Soft Silver borders define every edge.</div>
</div>
</body></html>
