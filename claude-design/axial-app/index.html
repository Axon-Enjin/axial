<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440">
  <title>Axial — UI Kit</title>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-on-surface);
      font-family: var(--font-sans);
    }
    .layout { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }
    .main   { min-width: 0; }
    /* scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0e141a; }
    ::-webkit-scrollbar-thumb { background: #2f353c; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #45464d; }

    /* dashed border slow pulse for the upload zone */
    @keyframes axl-teal-pulse {
      0%,100% { box-shadow: 0 0 15px rgba(45,212,191,0.3); }
      50%     { box-shadow: 0 0 25px rgba(45,212,191,0.5); }
    }
    .axl-pulse-teal { animation: axl-teal-pulse 2s ease-in-out infinite; }
    @keyframes axl-shimmer {
      0%   { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }
    .axl-progress-fill {
      background: linear-gradient(90deg, rgba(45,212,191,0.6), #2DD4BF, rgba(45,212,191,0.6));
      background-size: 200px 100%;
      animation: axl-shimmer 1.6s linear infinite;
    }
    /* prevent layout shift */
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="Overview.jsx"></script>
  <script type="text/babel" src="Liquidity.jsx"></script>
  <script type="text/babel" src="Compliance.jsx"></script>
  <script type="text/babel" src="Settings.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
